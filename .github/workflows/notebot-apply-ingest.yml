name: NoteBot - apply ingest to DB

# Fires when the cloud agent's ingest PR merges to main (it edits .ingest/applied.json).
# On a GitHub runner (which can reach the DB), marks the submissions pr-opened and mirrors
# the notes into the v2 `notes` table, then blanks the manifest. The [skip ci] on the blanking
# commit prevents this workflow from re-triggering itself.

on:
  push:
    branches: [main]
    paths:
      - ".ingest/applied.json"

permissions:
  contents: write

concurrency:
  group: notebot-ingest-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install pg@8 --no-save
      - name: Apply manifest to DB
        run: node .github/scripts/apply-ingest.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Clear applied manifest
        run: |
          git config user.name "notebot-ci"
          git config user.email "notebot-ci@users.noreply.github.com"
          git add .ingest/applied.json
          if git diff --staged --quiet; then
            echo "manifest already clear"
          else
            git commit -m "chore(ingest): clear applied manifest [skip ci]"
            git push
          fi
