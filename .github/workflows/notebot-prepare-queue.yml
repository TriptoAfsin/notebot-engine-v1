name: NoteBot - prepare ingest queue

# Reads the staging DB on a GitHub runner (which has network egress the cloud sandbox lacks)
# and commits the pending queue to .ingest/pending.json so the cloud agent can read it from
# its checkout.
#
# TIMING — the queue must be committed inside this daily window:
#   04:00 UTC (10:00 BDT) n8n stages new submissions  →  05:00 UTC (11:00 BDT) cloud routine reads
# GitHub delays scheduled runs on this repo by ~3.5h in practice, so two entries cover both
# punctual and drifted behaviour. The job is idempotent (commits only when the queue changed),
# so a second run in the same window is harmless.

on:
  schedule:
    - cron: "8 1 * * *" # if GitHub drifts ~3.5h → lands ~04:40 UTC, inside the window
    - cron: "6 4 * * *" # if GitHub is punctual  → lands ~04:06 UTC, inside the window
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notebot-ingest-queue
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install pg@8 --no-save
      - name: Generate queue
        run: node .github/scripts/prepare-queue.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit refreshed queue
        run: |
          git config user.name "notebot-ci"
          git config user.email "notebot-ci@users.noreply.github.com"
          git add .ingest/pending.json
          if git diff --staged --quiet; then
            echo "queue unchanged — nothing to commit"
          else
            git commit -m "chore(ingest): refresh pending queue [skip ci]"
            git push
          fi
